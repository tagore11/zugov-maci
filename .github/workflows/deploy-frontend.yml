name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - "apps/zugov-frontend/**"
      - "packages/crypto/**"
      - "packages/domainobjs/**"
      - "packages/core/**"
      - "packages/contracts/**"
      - "packages/sdk/**"
      - "scripts/build-frontend.sh"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install
        # Scoped to the frontend's actual dependency closure (itself + its workspace deps),
        # not the whole monorepo — the unscoped install previously pulled in packages/circuits
        # (9.0GB on disk) and packages/cli (2.3GB), neither of which scripts/build-frontend.sh
        # ever touches. The `...` suffix follows the real dependency graph, so a future change
        # to the frontend's dependencies is picked up automatically instead of needing this
        # filter list hand-maintained.
        run: pnpm install --frozen-lockfile --filter "zugov..."

      - name: Build
        env:
          VITE_API_URL: https://api.zugov.xyz
          VITE_PRIVY_APP_ID: ${{ secrets.VITE_PRIVY_APP_ID }}
        run: |
          set -euo pipefail
          if [ -z "$VITE_PRIVY_APP_ID" ]; then
            echo "::error::VITE_PRIVY_APP_ID secret is not set — the deployed app would break at runtime for every visitor. Set it with: gh secret set VITE_PRIVY_APP_ID"
            exit 1
          fi
          sh scripts/build-frontend.sh

      - name: Deploy to server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          install -m 600 -D /dev/null ~/.ssh/deploy_key
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" \
            apps/zugov-frontend/dist/ "$DEPLOY_USER@$DEPLOY_HOST:/var/www/zugov-frontend/"

      - name: Verify site is serving
        # Confirms the deployed files are actually being served correctly, not just that
        # rsync completed without error — catches a bad build artifact or a broken nginx
        # config that a clean rsync exit code wouldn't. Bounded retry window since nginx
        # serves the synced files directly (no restart needed), but DNS/TLS/network blips
        # shouldn't fail the deploy on the first attempt.
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 https://zugov.xyz/ -o /dev/null
