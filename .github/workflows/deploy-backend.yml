name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - "apps/zugov-backend/**"
      - "deploy/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-backend.yml"

concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # Default command_timeout is 10m — the multi-stage Docker build alone (pnpm install
          # for both the backend and subgraph deploy stages) already takes ~9-10m, leaving no
          # room for drizzle-kit migrate/compose up/image prune before the SSH session is killed
          # (see run 32031989077: build succeeded, "Run Command Timeout" hit right after image
          # export — docker compose up -d never ran, so the new image was built but not deployed).
          command_timeout: 25m
          script: |
            set -euo pipefail
            cd /opt/zugov
            git fetch origin main
            git reset --hard origin/main
            cd deploy
            docker compose build backend
            docker compose run --rm backend node_modules/.bin/drizzle-kit migrate
            docker compose up -d
            # graph-node-config.toml is bind-mounted — compose only recreates a container when
            # the service definition itself changes, not when a mounted file's contents do, so
            # config edits (e.g. provider `features`) would otherwise never take effect on a
            # running graph-node. Its indexing state lives in the separate graph-postgres
            # volume, not the container, so recreating it on every deploy is safe.
            docker compose up -d --force-recreate graph-node
            docker image prune -f
