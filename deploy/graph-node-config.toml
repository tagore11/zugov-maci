# Multi-chain graph-node config. Required because the stock image's `ethereum` env var
# (docker/start's `--ethereum-rpc $ethereum`) only ever emits ONE --ethereum-rpc flag — it
# has no comma/space-splitting logic, so it structurally cannot describe more than one
# network. This file is the officially supported way to configure multiple chains; see
# https://github.com/graphprotocol/graph-node/blob/master/docs/config.md.
#
# Provider `url` and the store `connection` string are expanded from this process's own
# environment at startup (graph-node calls shellexpand::env on them internally) — no
# preprocessing (e.g. envsubst) needed, as long as the referenced vars are set on the
# graph-node service in docker-compose.yml.
[chains]
ingestor = "node"

[chains.scroll-sepolia]
shard = "primary"
provider = [{ label = "scroll-sepolia", url = "${SCROLL_SEPOLIA_RPC_URL}", features = [] }]

[chains.sepolia]
shard = "primary"
provider = [{ label = "sepolia", url = "${SEPOLIA_RPC_URL}", features = [] }]

[store]
[store.primary]
connection = "postgresql://graph-node:${GRAPH_POSTGRES_PASSWORD}@graph-postgres:5432/graph-node"
pool_size = 10

[deployment]
[[deployment.rule]]
indexers = ["node"]
