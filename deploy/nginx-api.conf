# Reference copy of the host nginx config for this server — it already runs nginx for other
# sites, so both the frontend and backend are fronted by it rather than a bundled reverse proxy
# or a separate host (Vercel). Install at /etc/nginx/sites-available/zugov on the host, symlink
# into sites-enabled, then run `certbot --nginx -d api.zugov.xyz` and
# `certbot --nginx -d zugov.xyz -d www.zugov.xyz` to fill in the SSL blocks and HTTP->HTTPS
# redirects.

# zugov.xyz — static build of apps/zugov-frontend, deployed by .github/workflows/deploy-frontend.yml
# to /var/www/zugov-frontend on the host.
server {
    listen 80;
    server_name zugov.xyz www.zugov.xyz;

    root /var/www/zugov-frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# api.zugov.xyz — apps/zugov-backend, running in Docker and bound to 127.0.0.1:3002
# (see deploy/docker-compose.yml).
server {
    listen 80;
    server_name api.zugov.xyz;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
