# Reference copy of the host nginx site config for api.zugov.xyz — this server already runs
# nginx for other sites, so the backend is fronted by it rather than a bundled reverse proxy.
# Install at /etc/nginx/sites-available/ on the host, symlink into sites-enabled, then run
# `certbot --nginx -d api.zugov.xyz` to fill in the SSL block and add the HTTP->HTTPS redirect.
server {
    listen 80;
    server_name api.zugov.xyz;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
