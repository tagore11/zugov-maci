services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: zugov
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: apps/zugov-backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      graph-node:
        condition: service_healthy
      coordinator:
        condition: service_started
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/zugov
      CORS_ORIGIN: ${CORS_ORIGIN}
      SCROLL_SEPOLIA_RPC_URL: ${SCROLL_SEPOLIA_RPC_URL}
      SEPOLIA_RPC_URL: ${SEPOLIA_RPC_URL}
      PORT: 3001
      # apps/subgraph is bundled into this image at /app/subgraph (see Dockerfile);
      # graph-node/ipfs/coordinator are reached by compose service name, not host-bound ports.
      SUBGRAPH_DIR: /app/subgraph
      GRAPH_NODE_ADMIN_URL: http://graph-node:8020
      GRAPH_NODE_IPFS_URL: http://ipfs:5001
      GRAPH_NODE_QUERY_URL: http://graph-node:8000
      COORDINATOR_URL: http://coordinator:3001
      # Private key for the low-stakes keypair registered in coordinator's COORDINATOR_ADDRESSES
      # (see the coordinator service above) — proves this backend is an authorized caller.
      # Never the coordinator's own COORDINATOR_MACI_PRIVATE_KEY, which stays inside that
      # service only, per the constitution's privacy requirement.
      COORDINATOR_CALLER_PRIVATE_KEY: ${COORDINATOR_CALLER_PRIVATE_KEY}
    # Bound to localhost only — the host's nginx (already handling TLS/other
    # sites on this box) reverse-proxies to this port. See deploy/nginx-api.conf.
    ports:
      - "127.0.0.1:3002:3001"

  graph-postgres:
    image: postgres:14-alpine
    restart: unless-stopped
    command: ["postgres", "-cshared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_USER: graph-node
      POSTGRES_PASSWORD: ${GRAPH_POSTGRES_PASSWORD}
      POSTGRES_DB: graph-node
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    volumes:
      - graph-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graph-node"]
      interval: 5s
      timeout: 5s
      retries: 10

  ipfs:
    image: ipfs/kubo:v0.14.0
    restart: unless-stopped
    volumes:
      - ipfs-data:/data/ipfs
    # Internal only — reached over the compose network by graph-node/backend, never exposed to the host.

  graph-node:
    image: graphprotocol/graph-node
    restart: unless-stopped
    depends_on:
      graph-postgres:
        condition: service_healthy
      ipfs:
        condition: service_started
    environment:
      # Network names here must exactly match the `network:` field the deploy
      # script writes into each community's subgraph.yaml (see
      # apps/subgraph/scripts/deploy-community.mjs) — "scroll-sepolia"/"sepolia",
      # not underscored variants. A chain added to apps/zugov-frontend/src/config.ts's
      # supportedChains needs an entry added here too (in graph-node-config.toml, and in
      # apps/zugov-backend/src/services/chainRpc.ts's NETWORK_NAMES/RPC_URLS), or
      # that chain's communities fail subgraph deployment.
      #
      # Multi-chain setup lives in graph-node-config.toml (mounted below) rather than the
      # simpler `ethereum` env var — that var only ever produces one --ethereum-rpc flag,
      # so it can't describe more than one network. node_id must match the `ingestor` and
      # `deployment.rule.indexers` values in that file.
      node_id: node
      GRAPH_NODE_CONFIG: /etc/graph-node/config.toml
      GRAPH_POSTGRES_PASSWORD: ${GRAPH_POSTGRES_PASSWORD}
      SCROLL_SEPOLIA_RPC_URL: ${SCROLL_SEPOLIA_RPC_URL}
      SEPOLIA_RPC_URL: ${SEPOLIA_RPC_URL}
      ipfs: "ipfs:5001"
      GRAPH_LOG: info
    volumes:
      - ./graph-node-config.toml:/etc/graph-node/config.toml:ro
    # graph-node takes 30-60s+ to become ready after starting (connecting to
    # Postgres, running migrations) before the admin RPC port opens — without
    # this, `backend`'s `depends_on: condition: service_started` only waits for
    # the container to start, not for graph-node to actually be able to accept
    # subgraph deploys, so a community created right after a fresh deploy would
    # fail exactly like `service_started` alone would let happen.
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8020"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 90s
    # Bound to localhost only — the backend container reaches it via the
    # compose network (http://graph-node:8000 query, :8020 admin), and it's
    # never exposed publicly. Ports are still published to 127.0.0.1 (rather
    # than left compose-network-only) so `deploy-community.mjs` can also be
    # run manually from the host for debugging.
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8020:8020"
      - "127.0.0.1:8030:8030"

  coordinator-redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  coordinator:
    build:
      context: ..
      dockerfile: apps/coordinator/Dockerfile
    restart: unless-stopped
    depends_on:
      coordinator-redis:
        condition: service_healthy
    # coordinator.env holds COORDINATOR_MACI_PRIVATE_KEY — the real vote-decryption key. It must
    # never end up in this file or deploy/.env (both are read by other services / less sensitive).
    env_file:
      - coordinator.env
    environment:
      # This platform's communities use state tree depth 10 (apps/zugov-frontend/src/
      # constants.ts), which only has a TEST (non-ceremony) trusted setup available upstream —
      # the real ceremony-backed zkeys published for this MACI version are depth 14, the wrong
      # depth for this platform. Accepted for now since every community here is on Sepolia
      # testnet (see TODO.md) — revisit before any deployment handling real value.
      COORDINATOR_TALLY_ZKEY_NAME: VoteTally_10-1-2_test
      COORDINATOR_MESSAGE_PROCESS_ZKEY_NAME: MessageProcessor_10-20-2_test
      COORDINATOR_POLL_JOINING_ZKEY_NAME: PollJoining_10_test
      COORDINATOR_POLL_JOINED_ZKEY_NAME: PollJoined_10_test
      # Per-chain RPC urls (apps/coordinator/ts/common/chain.ts's getRpcUrl resolves the right
      # one from each request's `chain` field) — a community on a chain with no entry here
      # fails that request instead of silently reusing another chain's endpoint. Both source
      # vars already exist above for `backend`/`graph-node`.
      COORDINATOR_SEPOLIA_RPC_URL: ${SEPOLIA_RPC_URL}
      COORDINATOR_SCROLL_SEPOLIA_RPC_URL: ${SCROLL_SEPOLIA_RPC_URL}
      COORDINATOR_REDIS_HOST: coordinator-redis
      COORDINATOR_REDIS_PORT: 6379
      COORDINATOR_PORT: 3001
      # Public address of the dedicated low-stakes keypair zugov-backend signs with to
      # authenticate to this service — proves "this caller is authorized," decrypts nothing.
      # Its private key lives in deploy/.env (COORDINATOR_CALLER_PRIVATE_KEY), read by `backend`.
      COORDINATOR_ADDRESSES: "0x7363b2d54463CC75e2d21de98a629675E0c685d3"
      # RSA keypair used to encrypt the auth handshake with `backend` (see coordinatorClient.ts).
      # Generated at image build time by `pnpm run generate-keypair` (Dockerfile), written to
      # ./public.key/./private.key relative to the image's /maci/apps/coordinator WORKDIR — the
      # same directory `start:prod` runs from, so these relative paths resolve correctly.
      COORDINATOR_PUBLIC_KEY_PATH: ./public.key
      COORDINATOR_PRIVATE_KEY_PATH: ./private.key
    # Internal only, like graph-node/ipfs above — zugov-backend reaches it over the compose
    # network by service name (http://coordinator:3001), never exposed publicly. Still bound to
    # 127.0.0.1 for host-side debugging.
    ports:
      - "127.0.0.1:3003:3001"

volumes:
  postgres-data:
  graph-postgres-data:
  ipfs-data:
