services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: zugov
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: apps/zugov-backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/zugov
      CORS_ORIGIN: ${CORS_ORIGIN}
      SCROLL_SEPOLIA_RPC_URL: ${SCROLL_SEPOLIA_RPC_URL}
      SEPOLIA_RPC_URL: ${SEPOLIA_RPC_URL}
      PORT: 3001
    # Bound to localhost only — the host's nginx (already handling TLS/other
    # sites on this box) reverse-proxies to this port. See deploy/nginx-api.conf.
    ports:
      - "127.0.0.1:3002:3001"

volumes:
  postgres-data:
